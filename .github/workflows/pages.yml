name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp gestao_armazem_catenaria.html _site/
          cp index.html _site/
          cp dados_armazem_catenaria.json _site/
          cp .nojekyll _site/
          [ -d app ] && cp -r app _site/
          [ -d PASSAGEM_PARA_CLAUDE ] && cp -r PASSAGEM_PARA_CLAUDE _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
